server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Astro emits content-hashed assets under /_astro. They can never change
    # meaning, so they are safe to cache forever.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The background video and its poster. Large, static, and worth caching
    # hard; byte ranges matter so the browser can seek and buffer.
    location /media/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /favicon.svg {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Static build with directory-format routes: /languages/ -> /languages/index.html.
    # Unknown paths get a real 404 rather than the home page, because this is a
    # multi-page site, not a single-page app.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;

    # The site is fully self-contained: no third-party scripts, no analytics.
    # Fonts are the one external origin.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
